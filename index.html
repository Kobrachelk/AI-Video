<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sipwi — เลือกตัวละครที่ใช่ แล้วแชร์ให้เพื่อน</title>
  <meta name="description" content="เลือกตัวละครที่ตรงกับคุณ แล้วแชร์ให้เพื่อน ๆ บนโซเชียลได้ในคลิกเดียว">
  <meta name="theme-color" content="#0f0b1e">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Sipwi — เลือกตัวละครที่ใช่">
  <meta property="og:description" content="เลือกตัวละครที่ตรงกับคุณ แล้วแชร์ให้เพื่อน ๆ บนโซเชียลได้ในคลิกเดียว">
  <meta name="twitter:card" content="summary">

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E✨%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="container hero">
    <p class="badge">✨ ยินดีต้อนรับสู่</p>
    <h1 class="logo">Sipwi</h1>
    <p class="lead">เลือกตัวละครที่ตรงกับคุณ<br>แล้วแชร์ให้เพื่อน ๆ ดูได้ในคลิกเดียว</p>

    <a class="btn btn-primary btn-lg" href="pages/characters.html">เริ่มเลย →</a>

    <!-- แสดงตัวละครล่าสุดที่เคยเลือก (เติมโดย main.js) -->
    <a id="lastPick" class="last-pick" href="pages/characters.html" hidden>
      <span class="last-pick__emoji" id="lastPickEmoji"></span>
      <span>
        <small>ตัวละครล่าสุดของคุณ</small>
        <strong id="lastPickName"></strong>
      </span>
    </a>

    <section class="share" aria-label="แชร์เว็บไซต์">
      <h2 class="share__title">ชวนเพื่อนมาเล่น</h2>
      <div class="share__row">
        <button class="btn btn-share" type="button" data-share="native">📲 แชร์</button>
        <button class="btn btn-share btn-line" type="button" data-share="line">LINE</button>
        <button class="btn btn-share btn-fb" type="button" data-share="facebook">Facebook</button>
        <button class="btn btn-share btn-x" type="button" data-share="x">X</button>
        <button class="btn btn-share" type="button" data-share="copy">🔗 คัดลอกลิงก์</button>
      </div>
    </section>
  </main>

  <footer class="footer">© <span id="year"></span> Sipwi</footer>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="js/main.js"></script>
</body>
</html>
